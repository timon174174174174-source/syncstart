<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Общий старт</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#0e1116">
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --panel2: #1e232c; --line: #2a303b;
    --text: #e8ecf2; --muted: #8b94a3; --accent: #f5a524; --ok: #3ecf8e;
    --bad: #f0616d; --blue: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  input, select { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; font: inherit; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  input.err { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(240, 97, 109, .2); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .stack > * + * { margin-top: 8px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 14px; cursor: pointer;
    background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .primary { background: var(--accent); color: #1a1205; border-color: transparent; }
  .okb { background: var(--ok); color: #04150d; border-color: transparent; }
  .danger { background: transparent; color: var(--bad); border-color: #4a2a30; }
  .small { padding: 6px 9px; font-size: 13px; border-radius: 8px; }
  .code { font: 700 30px/1 ui-monospace, Consolas, monospace; letter-spacing: 6px; color: var(--accent); }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); }
  ul.players { list-style: none; margin: 0; padding: 0; max-height: 55vh; overflow-y: auto; }
  ul.players li { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--line); }
  ul.players li:first-child { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ready { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; }
  .tag.host { background: #3a2c0c; color: var(--accent); }
  .tag.you { background: #12283f; color: var(--blue); }
  .tag.off { background: #2a2a2a; color: var(--muted); }
  .status { font-size: 13px; color: var(--muted); }
  .ping { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; color: var(--muted); }
  .ping.good { color: var(--ok); } .ping.mid { color: var(--accent); } .ping.bad { color: var(--bad); }
  .status.ready { color: var(--ok); }
  #countdown { position: fixed; inset: 0; background: rgba(8,10,14,.94); display: none;
    flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 16px; }
  #countdown.show { display: flex; }
  #cdNum { font: 800 min(42vw, 260px)/1 system-ui, sans-serif; color: var(--accent); font-variant-numeric: tabular-nums; }
  #cdNum.go { color: var(--ok); }
  #cdInfo { color: var(--muted); margin-top: 12px; min-height: 1.4em; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2b1a1d;
    color: #ffd2d6; border: 1px solid #5b2b33; padding: 10px 14px; border-radius: 10px; display: none; z-index: 20; max-width: 92vw; }
  .toast.info { background: #13241c; color: #c9f5df; border-color: #245a40; }
  .conn { font-size: 12px; color: var(--muted); }
  .conn.bad { color: var(--bad); }
  .hidden { display: none !important; }
  /* "who's faster" mini-game */
  .gscore { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .gscore span { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: 13px; }
  .gscore b { color: var(--accent); margin-left: 4px; }
  #game { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16px; user-select: none; -webkit-user-select: none; touch-action: manipulation; cursor: pointer; }
  #game.show { display: flex; }
  #game.wait { background: #7a1620; }
  #game.go { background: #128a4c; }
  #game.res { background: rgba(8,10,14,.96); cursor: default; }
  #gBig { font: 800 min(16vw, 110px)/1.05 system-ui, sans-serif; }
  #game.res #gBig { font-size: min(10vw, 64px); overflow-wrap: anywhere; }
  #gSmall { margin-top: 14px; font-size: 17px; opacity: .9; min-height: 1.4em; }
  #gTable { margin-top: 18px; width: min(420px, 92vw); list-style: none; padding: 0; text-align: left; max-height: 50vh; overflow-y: auto; }
  #gTable li { display: flex; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 15px; }
  #gTable li.me { background: #12283f; border-radius: 8px; }
  #gTable .pl { width: 28px; color: var(--muted); }
  #gTable .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #gTable .tm { font-variant-numeric: tabular-nums; }
  #gTable li:first-child .tm { color: var(--ok); font-weight: 700; }
  .tm.bad { color: var(--bad) !important; } .tm.none { color: var(--muted) !important; }
  #gBtns { margin-top: 18px; display: none; gap: 8px; }
  #game.res.final #gBtns { display: flex; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }

  /* stream chat: right column on wide screens, bottom sheet on phones */
  #chat { position: fixed; z-index: 5; background: var(--panel); display: none; flex-direction: column;
    left: 0; right: 0; bottom: 0; height: 70vh; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,.5); overflow: hidden; }
  body.chat-open #chat { display: flex; }
  .chat-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .tab { white-space: nowrap; flex: none; padding: 6px 10px; font-size: 13px; border-radius: 8px; background: transparent; border-color: transparent; color: var(--muted); }
  .tab.on { background: var(--panel2); border-color: var(--line); color: var(--text); }
  .tab .ic { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  .ic.yt { background: #ff3b3b; } .ic.tw { background: #a970ff; } .ic.all { background: var(--accent); border-radius: 50%; animation: blink 1.6s infinite; }
  .chat-head a, .chat-foot a { color: var(--blue); text-decoration: none; font-size: 13px; white-space: nowrap; }
  .chat-head a:hover, .chat-foot a:hover { text-decoration: underline; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff3b3b;
    margin-right: 7px; vertical-align: 1px; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .pane { flex: 1; min-height: 0; display: none; }
  .pane.on { display: block; }
  iframe.pane { width: 100%; border: 0; background: #0f0f0f; }
  #feedWrap { position: relative; }
  #feed { height: 100%; overflow-y: auto; padding: 6px 12px 10px; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
  #feed .m { padding: 3px 0; }
  #feed .m.paid { background: #3a2c0c; border-radius: 8px; padding: 5px 8px; margin: 3px -4px; }
  #feed .src { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 4px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; color: #fff; }
  #feed .src.yt { background: #cc1f1f; } #feed .src.tw { background: #7c3aed; }
  #feed .n { font-weight: 700; color: #b9c2cf; margin-right: 4px; }
  #feed .amt { color: var(--accent); font-weight: 700; margin-right: 4px; }
  #feed img { height: 22px; vertical-align: middle; margin: -3px 1px; }
  #feed .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
  #newMsgs { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: none;
    background: var(--accent); color: #1a1205; border: 0; border-radius: 999px; padding: 6px 14px; font-size: 13px; }
  .chat-foot { font-size: 12px; color: var(--muted); padding: 6px 12px; border-top: 1px solid var(--line); }
  #chatFab { position: fixed; z-index: 5; right: 16px; bottom: 16px; display: none;
    background: var(--panel2); box-shadow: 0 4px 18px rgba(0,0,0,.45); border-radius: 999px; padding: 10px 16px; }
  body.live:not(.chat-open) #chatFab { display: block; }
  @media (min-width: 1000px) {
    #chat { left: auto; top: 0; height: auto; width: 380px; border-top: 0; border-left: 1px solid var(--line);
      border-radius: 0; box-shadow: none; }
    body.chat-open { padding-right: 380px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Общий <span>старт</span></h1>
  <div class="sub">Одновременный отсчёт для кооперативных игр</div>

  <!-- home -->
  <div id="home">
    <div class="card stack">
      <h2>Ник</h2>
      <input id="nick" maxlength="24" placeholder="Твой ник" autocomplete="off">
    </div>
    <div class="card stack" id="createCard">
      <h2>Новая комната</h2>
      <button class="primary" id="btnCreate" style="width:100%">Создать комнату</button>
    </div>
    <div class="card stack">
      <h2>Войти в комнату</h2>
      <div class="row">
        <input id="joinCode" maxlength="5" placeholder="Код" autocomplete="off" style="text-transform:uppercase;letter-spacing:3px">
        <button id="btnJoin" style="flex:0 0 auto">Войти</button>
      </div>
    </div>
  </div>

  <!-- room -->
  <div id="room" class="hidden">
    <div class="card">
      <div class="between">
        <div>
          <div class="muted" style="font-size:13px">Код комнаты</div>
          <div class="code" id="roomCode">-----</div>
        </div>
        <div class="stack" style="text-align:right">
          <button class="small" id="btnCopy">Скопировать ссылку</button>
          <div class="conn" id="conn">подключено</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="between" style="margin-bottom:8px">
        <h2 style="margin:0">Участники <span id="cnt" class="muted"></span></h2>
        <button class="small" id="btnSound">🔊 Проверить звук</button>
      </div>
      <ul class="players" id="players"></ul>
    </div>

    <div class="card stack">
      <button class="okb" id="btnReady" style="width:100%;padding:14px">Я готов</button>
      <div id="hostBox" class="stack hidden">
        <div class="row">
          <select id="secs">
            <option value="3">Отсчёт 3 сек</option>
            <option value="5">Отсчёт 5 сек</option>
            <option value="10" selected>Отсчёт 10 сек</option>
            <option value="15">Отсчёт 15 сек</option>
          </select>
          <button class="primary" id="btnStart">Старт</button>
        </div>
      </div>
      <div id="waitHost" class="muted" style="text-align:center;font-size:13px">Отсчёт запускает хост</div>
    </div>

    <div class="card stack" id="gameCard">
      <div class="between">
        <h2 style="margin:0">Пока ждём: кто быстрее</h2>
        <button class="primary small" id="btnGame">⚡ Сыграть</button>
      </div>
      <div class="muted" style="font-size:13px" id="gameInfo"></div>
      <div class="gscore" id="gameScores"></div>
    </div>

    <button class="danger" id="btnLeave" style="width:100%">Выйти из комнаты</button>
  </div>

  <footer>Комнаты сохраняются при перезапуске сервера</footer>
</div>

<div id="countdown">
  <div id="cdNum">10</div>
  <div id="cdInfo"></div>
  <button class="danger hidden" id="btnCancel" style="margin-top:24px">Отменить</button>
</div>
<div class="toast" id="toast"></div>
<div id="game">
  <div id="gBig"></div>
  <div id="gSmall"></div>
  <ul id="gTable"></ul>
  <div id="gBtns"><button class="primary" id="gAgain">⚡ Ещё раунд</button><button id="gClose">Закрыть</button></div>
</div>

<aside id="chat" aria-label="Чат стрима">
  <div class="chat-head">
    <div class="tabs">
      <button class="tab" data-tab="all"><span class="ic all"></span>Общий</button>
      <button class="tab" data-tab="yt"><span class="ic yt"></span>YouTube</button>
      <button class="tab" data-tab="tw"><span class="ic tw"></span>Twitch</button>
    </div>
    <a id="chatWatch" target="_blank" rel="noopener">Смотреть ↗</a>
    <button class="small" id="chatHide" title="Скрыть чат">✕</button>
  </div>
  <div id="feedWrap" class="pane" data-pane="all">
    <div id="feed"><div class="empty">Сообщений пока нет</div></div>
    <button id="newMsgs">↓ Новые сообщения</button>
  </div>
  <iframe class="pane" data-pane="yt" id="frameYt" title="Чат стрима на YouTube" referrerpolicy="origin"></iframe>
  <iframe class="pane" data-pane="tw" id="frameTw" title="Чат стрима на Twitch"></iframe>
  <div class="chat-foot" id="chatFoot"></div>
</aside>
<button id="chatFab"><span class="live-dot"></span>Чат стрима</button>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  let token = store.get("ss_token");
  if (!/^[a-f0-9]{32}$/.test(token || "")) {
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    token = [...a].map((b) => b.toString(16).padStart(2, "0")).join("");
    store.set("ss_token", token);
  }
  $("nick").value = store.get("ss_nick") || "";

  let ws, me = null, room = null, wantRoom = null, retry = 0;
  let offset = 0, bestRtt = Infinity; // serverTime ≈ Date.now() + offset

  // ---------- sound ----------
  let ac = null;
  function audio() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function beep(freq = 880, dur = 0.12, vol = 0.25) {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = freq; o.type = "sine";
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  document.addEventListener("pointerdown", audio, { once: true });

  // ---------- ui helpers ----------
  let toastT;
  function toast(msg, info) {
    const t = $("toast"); t.textContent = msg; t.className = "toast" + (info ? " info" : "");
    t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = "none"), 3500);
  }
  function nick() {
    const n = $("nick").value.trim().slice(0, 24);
    if (n) store.set("ss_nick", n);
    return n;
  }
  function needNick() {
    if (nick()) return false;
    show("home");
    const el = $("nick"); el.classList.add("err"); el.focus();
    toast("Сначала введи ник");
    return true;
  }
  $("nick").addEventListener("input", () => $("nick").classList.remove("err"));
  function show(view) {
    $("home").classList.toggle("hidden", view !== "home");
    $("room").classList.toggle("hidden", view !== "room");
  }

  // ---------- socket ----------
  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => {
      retry = 0; $("conn").textContent = "подключено"; $("conn").className = "conn";
      bestRtt = Infinity; for (let i = 0; i < 5; i++) setTimeout(ping, i * 250);
      if (wantRoom && nick()) ws.send(JSON.stringify({ t: "join", code: wantRoom, name: nick(), token }));
    };
    ws.onclose = () => {
      $("conn").textContent = "переподключение…"; $("conn").className = "conn bad";
      setTimeout(connect, Math.min(1000 * 2 ** retry++, 8000));
    };
    ws.onmessage = (e) => handle(JSON.parse(e.data));
  }
  function sendMsg(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ ...m, token })); }
  function ping() { sendMsg({ t: "ping", c: Date.now() }); }
  setInterval(ping, 10000);

  function handle(m) {
    switch (m.t) {
      case "pong": {
        const t1 = Date.now(), rtt = t1 - m.c;
        if (rtt <= bestRtt) { bestRtt = rtt; offset = m.s - (m.c + rtt / 2); }
        break;
      }
      case "joined":
        me = m.you; wantRoom = m.code; store.set("ss_room", m.code);
        history.replaceState(null, "", "?r=" + m.code);
        show("room");
        break;
      case "state":
        room = m.room; render(); break;
      case "error":
        if (m.field === "nick") { needNick(); break; }
        toast(m.msg);
        if (!room) {
          wantRoom = null; store.del("ss_room");
          // the invite led nowhere (room gone / banned): drop ?r= so "create room" comes back
          history.replaceState(null, "", location.pathname); updateCreateCard();
        }
        break;
      case "kicked":
        leaveLocal(); toast(m.ban ? "Хост забанил тебя в этой комнате" : "Хост кикнул тебя из комнаты"); break;
      case "closed":
        leaveLocal(); toast("Хост закрыл комнату"); break;
      case "game_go":
        gameGo(m.round); break;
      case "replaced":
        wantRoom = null; toast("Ты открыл комнату в другой вкладке"); break;
    }
  }

  function leaveLocal() {
    wantRoom = null; room = null; me = null; store.del("ss_room");
    history.replaceState(null, "", location.pathname);
    stopCountdown(); gHide(); show("home"); updateCreateCard();
  }

  // Came in by an invite link (?r=CODE): only joining makes sense, hide "create room"
  function updateCreateCard() {
    const invited = /^[A-Za-z0-9]{5}$/.test(new URLSearchParams(location.search).get("r") || "");
    $("createCard").classList.toggle("hidden", invited);
  }

  // ---------- render ----------
  function render() {
    if (!room) return;
    const isHost = room.host === me;
    const players = room.players;
    const allReady = players.length > 0 && players.every((p) => p.ready);
    const meP = players.find((p) => p.id === me);

    $("roomCode").textContent = room.code;
    $("cnt").textContent = `· ${players.filter((p) => p.ready).length}/${players.length} готовы`;

    const ul = $("players"); ul.innerHTML = "";
    for (const p of players) {
      const li = document.createElement("li");
      const dot = document.createElement("span"); dot.className = "dot" + (p.ready ? " ready" : "");
      const name = document.createElement("span"); name.className = "pname"; name.textContent = p.name;
      if (p.id === room.host) name.insertAdjacentHTML("beforeend", '<span class="tag host">ХОСТ</span>');
      if (p.id === me) name.insertAdjacentHTML("beforeend", '<span class="tag you">ТЫ</span>');
      if (!p.online) name.insertAdjacentHTML("beforeend", '<span class="tag off">НЕТ СВЯЗИ</span>');
      const st = document.createElement("span"); st.className = "status" + (p.ready ? " ready" : "");
      st.textContent = p.ready ? "готов" : "не готов";
      const pg = document.createElement("span"); pg.className = "ping";
      if (p.online && p.ping != null) {
        pg.textContent = p.ping + " мс";
        pg.classList.add(p.ping < 100 ? "good" : p.ping < 250 ? "mid" : "bad");
        pg.title = "Задержка до сервера. На синхронность отсчёта не влияет.";
      }
      li.append(dot, name, pg, st);
      if (isHost && p.id !== me) {
        const kick = document.createElement("button"); kick.className = "small danger"; kick.title = "Кикнуть (сможет зайти снова)"; kick.textContent = "✕";
        kick.onclick = () => { if (confirm(`Кикнуть ${p.name}? Он сможет зайти снова.`)) sendMsg({ t: "kick", id: p.id }); };
        const ban = document.createElement("button"); ban.className = "small danger"; ban.title = "Забанить (не сможет вернуться)"; ban.textContent = "⛔";
        ban.onclick = () => { if (confirm(`Забанить ${p.name}? Он не сможет вернуться в эту комнату.`)) sendMsg({ t: "kick", id: p.id, ban: true }); };
        li.append(kick, ban);
      }
      ul.append(li);
    }

    const ready = !!(meP && meP.ready);
    $("btnReady").textContent = ready ? "Не готов" : "Я готов";
    $("btnReady").className = ready ? "" : "okb";
    $("btnReady").disabled = !!room.countdown;

    $("hostBox").classList.toggle("hidden", !isHost);
    $("waitHost").classList.toggle("hidden", isHost);
    const hostP = players.find((p) => p.id === room.host);
    $("waitHost").textContent = hostP && !hostP.online
      ? "Хост отключился, ждём его возвращения…"
      : "Отсчёт запускает хост";
    $("secs").value = String(room.seconds);
    $("secs").disabled = !!room.countdown;
    $("btnStart").disabled = !!room.countdown;
    $("btnCancel").classList.toggle("hidden", !isHost);
    $("btnLeave").textContent = isHost ? "Закрыть комнату" : "Выйти из комнаты";

    if (room.countdown) startCountdown(room.countdown); else stopCountdown();
    renderGame();
  }

  // ---------- "who's faster" ----------
  // The server says when to turn green ("game_go"); the reaction is timed here, from the frame the
  // screen turned green to the tap, so a player's ping doesn't count against them.
  const GAME_HELP = "Экран станет красным, потом зелёным — жми как можно быстрее (клик, тап или пробел). Нажал раньше зелёного — фальстарт.";
  let gRound = 0, gState = null, gGoAt = 0, gClosed = 0, gHideT = null;
  const gEl = () => $("game");
  function gShow(cls, big, small) {
    gEl().className = "show " + cls;
    $("gBig").textContent = big; $("gSmall").textContent = small || "";
    if (!cls.includes("final")) $("gTable").innerHTML = "";
  }
  function gHide() { gEl().className = ""; clearTimeout(gHideT); }
  const nameOf = (id) => { const p = room && room.players.find((x) => x.id === id); return p ? p.name : "вышел"; };

  function renderGame() {
    const g = room.game;
    const sc = $("gameScores"); sc.innerHTML = "";
    const leaders = room.players.filter((p) => g.scores[p.id]).sort((a, b) => g.scores[b.id] - g.scores[a.id]);
    for (const p of leaders.slice(0, 12)) {
      const s = document.createElement("span"); s.textContent = p.name;
      const b = document.createElement("b"); b.textContent = "🏆" + g.scores[p.id]; s.append(b); sc.append(s);
    }
    const busy = g.phase === "wait" || g.phase === "go";
    $("btnGame").disabled = busy || !!room.countdown;
    $("gameInfo").textContent = busy ? `Идёт раунд (запустил(а) ${g.by})…` : GAME_HELP;

    if (room.countdown || g.phase === "idle") { gState = null; return gHide(); }
    if (g.round === gClosed) return; // this player closed the window for this round
    if (busy && !g.participants.includes(me)) return; // joined mid-round: wait for the next one

    if (busy) {
      if (g.round !== gRound) { gRound = g.round; gState = "wait"; gShow("wait", "Жди зелёного…", "Нажмёшь раньше — фальстарт"); }
      return;
    }
    // phase "done": everyone sees the table
    if (!g.participants.includes(me) && g.round !== gRound) return;
    gRound = g.round; gState = "final";
    const key = (r) => (r.ms != null ? r.ms : r.early ? 1e9 : 2e9);
    const rows = g.participants.map((id) => ({ id, r: g.results[id] || {} })).sort((a, b) => key(a.r) - key(b.r));
    const mine = g.results[me];
    const won = rows[0] && rows[0].r.ms != null;
    gShow("res final", !won ? "Никто не успел" : rows[0].id === me ? "Ты первый! 🏆" : `Победил(а) ${nameOf(rows[0].id)}`,
      mine ? (mine.early ? "У тебя фальстарт" : `Твоя реакция: ${mine.ms} мс`) : "");
    const ul = $("gTable"); ul.innerHTML = "";
    rows.forEach((x, i) => {
      const li = document.createElement("li"); if (x.id === me) li.className = "me";
      const pl = document.createElement("span"); pl.className = "pl"; pl.textContent = x.r.ms != null ? i + 1 : "—";
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = nameOf(x.id);
      const tm = document.createElement("span");
      tm.className = "tm" + (x.r.early ? " bad" : x.r.ms == null ? " none" : "");
      tm.textContent = x.r.early ? "фальстарт" : x.r.ms == null ? "не нажал" : x.r.ms + " мс";
      li.append(pl, nm, tm); ul.append(li);
    });
    clearTimeout(gHideT); gHideT = setTimeout(() => { gClosed = g.round; gHide(); }, 10000);
  }

  function gameGo(round) {
    if (round !== gRound || gState !== "wait") return;
    gState = "go";
    gShow("go", "ЖМИ!", "");
    gGoAt = 0;
    requestAnimationFrame(() => { gGoAt = performance.now(); }); // timed from the green frame
    beep(990, 0.08, 0.2);
  }

  function gameTap(e) {
    if (gState !== "wait" && gState !== "go") return;
    if (e) e.preventDefault();
    if (gState === "wait") {
      gState = "sent"; sendMsg({ t: "game_hit", round: gRound, early: true });
      return gShow("res", "Фальстарт!", "Ждём остальных…");
    }
    const ms = Math.max(1, Math.round(performance.now() - (gGoAt || performance.now())));
    gState = "sent"; sendMsg({ t: "game_hit", round: gRound, ms });
    gShow("res", ms + " мс", "Ждём остальных…");
  }
  gEl().addEventListener("pointerdown", (e) => { if (!e.target.closest("button")) gameTap(e); });
  document.addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.code === "Enter") && (gState === "wait" || gState === "go")) gameTap(e);
    else if (e.code === "Escape" && gState === "final") { gClosed = gRound; gHide(); }
  });
  $("btnGame").onclick = () => { audio(); gClosed = 0; sendMsg({ t: "game_start" }); };
  $("gAgain").onclick = () => { gClosed = 0; sendMsg({ t: "game_start" }); };
  $("gClose").onclick = () => { gClosed = gRound; gState = null; gHide(); };


  // ---------- countdown ----------
  let cdRaf = null, cdKey = null, lastSec = null;
  function startCountdown(cd) {
    const key = cd.startAt;
    if (cdKey === key) return;
    cdKey = key; lastSec = null;
    $("countdown").classList.add("show");
    $("cdInfo").textContent = cd.forced ? `${cd.by} запустил(а), не дожидаясь всех` : "";
    const tick = () => {
      const left = cd.startAt - (Date.now() + offset);
      const el = $("cdNum");
      if (left > 0) {
        const s = Math.ceil(left / 1000);
        el.textContent = s; el.className = "";
        if (s !== lastSec) { lastSec = s; if (s <= 3) beep(660, 0.12); }
        cdRaf = requestAnimationFrame(tick);
      } else {
        el.textContent = "GO!"; el.className = "go";
        if (lastSec !== 0) { lastSec = 0; beep(1320, 0.45, 0.35); $("cdInfo").textContent = "Удачи!"; }
      }
    };
    cancelAnimationFrame(cdRaf); tick();
  }
  function stopCountdown() {
    cancelAnimationFrame(cdRaf); cdKey = null;
    $("countdown").classList.remove("show");
  }

  // ---------- actions ----------
  $("btnCreate").onclick = () => { audio(); if (needNick()) return; sendMsg({ t: "create", name: nick() }); };
  $("btnJoin").onclick = () => {
    audio();
    if (needNick()) return;
    const code = $("joinCode").value.trim().toUpperCase();
    if (code.length !== 5) return toast("Код — 5 символов");
    wantRoom = code; sendMsg({ t: "join", code, name: nick() });
  };
  $("joinCode").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnJoin").click(); });
  $("nick").addEventListener("change", () => { if (room && nick()) sendMsg({ t: "rename", name: nick() }); });
  $("btnReady").onclick = () => {
    audio();
    const meP = room && room.players.find((p) => p.id === me);
    sendMsg({ t: "ready", v: !(meP && meP.ready) });
  };
  $("btnStart").onclick = () => sendMsg({ t: "start" });
  $("btnCancel").onclick = () => sendMsg({ t: "cancel" });
  $("secs").onchange = () => sendMsg({ t: "seconds", v: Number($("secs").value) });
  $("btnLeave").onclick = () => {
    if (room && room.host === me && !confirm("Закрыть комнату для всех?")) return;
    sendMsg({ t: "leave" }); leaveLocal();
  };
  $("btnSound").onclick = () => { beep(660, 0.12); setTimeout(() => beep(1320, 0.4, 0.35), 350); };
  $("btnCopy").onclick = async () => {
    const url = `${location.origin}${location.pathname}?r=${room.code}`;
    try { await navigator.clipboard.writeText(url); toast("Ссылка скопирована", true); }
    catch { prompt("Скопируй ссылку:", url); }
  };

  // ---------- start ----------
  const fromUrl = new URLSearchParams(location.search).get("r");
  const initial = (fromUrl || store.get("ss_room") || "").toUpperCase();
  if (/^[A-Z0-9]{5}$/.test(initial)) {
    $("joinCode").value = initial;
    if (nick()) wantRoom = initial;   // with a saved nick, rejoin automatically
    else $("nick").focus();           // otherwise ask for a nick first, then "Войти"
  }
  updateCreateCard();
  connect();
})();

// ---------- stream chat: merged feed + YouTube/Twitch tabs ----------
(() => {
  const $ = (id) => document.getElementById(id);
  const wide = window.matchMedia("(min-width: 1000px)");
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  let live = { youtube: null, twitch: null };
  let tab = store.get("ss_chat_tab") || "all";
  const loaded = { yt: null, tw: null }; // what each iframe currently shows
  const seen = new Set();
  const feed = $("feed");
  const MAX_MSGS = 300;

  const anyLive = () => !!(live.youtube || live.twitch);
  const available = (t) => t === "all" || (t === "yt" && !!live.youtube) || (t === "tw" && !!live.twitch);
  const urls = {
    ytWatch: () => `https://www.youtube.com/watch?v=${live.youtube}`,
    ytChat: () => `https://www.youtube.com/live_chat?v=${live.youtube}&embed_domain=${encodeURIComponent(location.hostname)}&dark_theme=1`,
    ytPopout: () => `https://www.youtube.com/live_chat?is_popout=1&v=${live.youtube}`,
    twWatch: () => `https://www.twitch.tv/${live.twitch}`,
    twChat: () => `https://www.twitch.tv/embed/${live.twitch}/chat?parent=${encodeURIComponent(location.hostname)}&darkpopout`,
    twPopout: () => `https://www.twitch.tv/popout/${live.twitch}/chat`,
  };

  function render() {
    const open = document.body.classList.contains("chat-open");
    const t = available(tab) ? tab : "all"; // remembered tab may be for a platform that is offline now
    for (const b of document.querySelectorAll(".tab")) {
      b.classList.toggle("hidden", !available(b.dataset.tab));
      b.classList.toggle("on", b.dataset.tab === t);
    }
    for (const p of document.querySelectorAll("#chat .pane")) p.classList.toggle("on", p.dataset.pane === t);
    // iframes load only once their tab is opened, and reload when the stream changes
    if (open && t === "yt" && loaded.yt !== live.youtube) { loaded.yt = live.youtube; $("frameYt").src = urls.ytChat(); }
    if (open && t === "tw" && loaded.tw !== live.twitch) { loaded.tw = live.twitch; $("frameTw").src = urls.twChat(); }
    const watch = t === "tw" || (t === "all" && !live.youtube) ? (live.twitch && urls.twWatch()) : (live.youtube && urls.ytWatch());
    if (watch) $("chatWatch").href = watch;
    const foot = $("chatFoot");
    const popout = (name, href) => {
      foot.textContent = `Писать можно, если вошёл в ${name}. Не получается — `;
      const a = document.createElement("a");
      a.target = "_blank"; a.rel = "noopener"; a.href = href; a.textContent = "открой чат в отдельном окне";
      foot.append(a);
    };
    if (t === "yt") popout("YouTube", urls.ytPopout());
    else if (t === "tw") popout("Twitch", urls.twPopout());
    else foot.textContent = live.youtube && live.twitch ? "Чтобы написать, открой вкладку YouTube или Twitch"
      : live.youtube ? "Чтобы написать, открой вкладку YouTube" : "Чтобы написать, открой вкладку Twitch";
    if (t === "all") stickIfNeeded(true);
  }

  function setOpen(open) {
    document.body.classList.toggle("chat-open", open && anyLive());
    render();
  }

  function applyLive(next) {
    const was = anyLive();
    live = { youtube: next.youtube || null, twitch: next.twitch || null };
    document.body.classList.toggle("live", anyLive());
    if (!live.youtube) { $("frameYt").removeAttribute("src"); loaded.yt = null; }
    if (!live.twitch) { $("frameTw").removeAttribute("src"); loaded.tw = null; }
    if (!anyLive()) return setOpen(false);
    if (!was) return setOpen(wide.matches && store.get("ss_chat_hidden") !== "1"); // on a phone it opens by the button
    render();
  }

  // ----- merged feed -----
  let stuck = true; // follow new messages while the reader is at the bottom
  feed.addEventListener("scroll", () => {
    stuck = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
    if (stuck) $("newMsgs").style.display = "none";
  });
  $("newMsgs").onclick = () => { stuck = true; stickIfNeeded(); };
  function stickIfNeeded(silent) {
    if (stuck) { feed.scrollTop = feed.scrollHeight; $("newMsgs").style.display = "none"; }
    else if (!silent) $("newMsgs").style.display = "block";
  }

  function msgNode(m) {
    const d = document.createElement("div");
    d.className = "m" + (m.paid ? " paid" : "");
    d.dataset.ts = m.ts || 0;
    const src = document.createElement("span");
    src.className = "src " + (m.src === "yt" ? "yt" : "tw");
    src.textContent = m.src === "yt" ? "YT" : "TW";
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = m.name;
    if (m.color && /^#[0-9a-fA-F]{6}$/.test(m.color)) n.style.color = m.color;
    d.append(src, n);
    if (m.paid) { const a = document.createElement("span"); a.className = "amt"; a.textContent = m.paid; d.append(a); }
    for (const p of m.parts || []) {
      if (p.img && /^https:\/\/(static-cdn\.jtvnw\.net|[\w.-]+\.(ggpht|googleusercontent|ytimg)\.com)\//.test(p.img)) {
        const i = document.createElement("img");
        i.src = p.img; i.alt = p.alt || ""; i.title = p.alt || ""; i.loading = "lazy"; i.referrerPolicy = "no-referrer";
        d.append(i);
      } else if (p.t) d.append(document.createTextNode(p.t));
    }
    return d;
  }

  function addMsgs(list) {
    let added = 0;
    for (const m of list) {
      if (!m || seen.has(m.id)) continue; // the backlog is resent after a reconnect
      seen.add(m.id);
      const empty = feed.querySelector(".empty");
      if (empty) empty.remove();
      // keep time order: history from one platform can arrive after live messages from the other
      let before = null;
      for (let el = feed.lastElementChild; el && Number(el.dataset.ts) > (m.ts || 0); el = el.previousElementSibling) before = el;
      feed.insertBefore(msgNode(m), before);
      added++;
    }
    while (feed.childElementCount > MAX_MSGS) feed.firstElementChild.remove();
    if (seen.size > 3000) { const keep = [...seen].slice(-1000); seen.clear(); keep.forEach((x) => seen.add(x)); }
    if (added) stickIfNeeded();
  }

  // ----- wiring -----
  for (const b of document.querySelectorAll(".tab")) b.onclick = () => { tab = b.dataset.tab; store.set("ss_chat_tab", tab); render(); };
  $("chatFab").onclick = () => { store.set("ss_chat_hidden", null); setOpen(true); };
  $("chatHide").onclick = () => { if (wide.matches) store.set("ss_chat_hidden", "1"); setOpen(false); };

  const es = new EventSource("/api/chat"); // reconnects by itself
  es.addEventListener("live", (e) => { try { applyLive(JSON.parse(e.data)); } catch {} });
  es.addEventListener("msgs", (e) => { try { addMsgs(JSON.parse(e.data)); } catch {} });
  render();
})();
</script>
</body>
