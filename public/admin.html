<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Админка · Общий старт</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --panel2: #1e232c; --line: #2a303b;
    --text: #e8ecf2; --muted: #8b94a3; --accent: #f5a524; --ok: #3ecf8e; --bad: #f0616d; --blue: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 14px; }
  h1 span { color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  input { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; font: inherit; outline: none; flex: 1; min-width: 160px; }
  .muted { color: var(--muted); }
  .room { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .head { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
  .code { font: 700 18px ui-monospace, Consolas, monospace; letter-spacing: 3px; color: var(--accent); }
  .meta { min-width: 0; }
  .meta .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-right: 4px; }
  .pill.ok { background: #12301f; color: var(--ok); }
  .pill.off { background: #2a2a2a; color: var(--muted); }
  .pill.cd { background: #3a2c0c; color: var(--accent); }
  .nums { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .body { display: none; border-top: 1px solid var(--line); padding: 10px 14px 14px; }
  .room.open .body { display: block; }
  .players { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .p { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 13px; }
  .p.ready { border-color: #245a40; }
  .p .d { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
  .p.ready .d { background: var(--ok); }
  .p.offline { opacity: .5; }
  button { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 12px; cursor: pointer;
    background: transparent; color: var(--bad); border: 1px solid #4a2a30; }
  button:hover { background: #2b1a1d; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .err { color: var(--bad); }
  @media (max-width: 560px) { .head { grid-template-columns: 70px 1fr; } .nums { grid-column: 1 / -1; text-align: left; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Админка · Общий <span>старт</span></h1>
  <div class="stats">
    <div class="stat"><b id="sRooms">–</b><span>активных комнат</span></div>
    <div class="stat"><b id="sPlayers">–</b><span>игроков в комнатах</span></div>
    <div class="stat"><b id="sOnline">–</b><span>на связи сейчас</span></div>
    <div class="stat"><b id="sConn">–</b><span>открытых вкладок</span></div>
    <div class="stat"><b id="sMem">–</b><span>память сервера</span></div>
    <div class="stat"><b id="sUp">–</b><span>работает без перезапуска</span></div>
  </div>
  <div class="bar">
    <input id="filter" placeholder="Поиск по коду или нику" autocomplete="off">
    <span class="muted" id="updated">обновление…</span>
  </div>
  <div id="list"></div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const open = new Set();
  let data = null;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function ago(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + " с";
    const m = Math.round(s / 60);
    if (m < 60) return m + " мин";
    const h = Math.floor(m / 60);
    if (h < 24) return h + " ч " + (m % 60) + " мин";
    return Math.floor(h / 24) + " д " + (h % 24) + " ч";
  }

  function render() {
    if (!data) return;
    const rooms = data.rooms;
    const q = $("filter").value.trim().toLowerCase();
    $("sRooms").textContent = rooms.length;
    $("sPlayers").textContent = rooms.reduce((a, r) => a + r.total, 0);
    $("sOnline").textContent = rooms.reduce((a, r) => a + r.online, 0);
    $("sConn").textContent = data.connections;
    $("sMem").textContent = data.memoryMB + " МБ";
    $("sUp").textContent = ago(data.now - data.startedAt);

    const shown = rooms.filter((r) => !q || r.code.toLowerCase().includes(q) ||
      r.players.some((p) => p.name.toLowerCase().includes(q)));
    if (!shown.length) {
      $("list").innerHTML = `<div class="empty">${rooms.length ? "Ничего не найдено" : "Активных комнат нет"}</div>`;
      return;
    }
    $("list").innerHTML = shown.map((r) => {
      const cd = r.countdown && r.countdown.startAt > data.now
        ? `<span class="pill cd">отсчёт ${Math.ceil((r.countdown.startAt - data.now) / 1000)} с</span>` : "";
      const hostSt = r.host
        ? `<span class="pill ${r.host.online ? "ok" : "off"}">${r.host.online ? "хост на связи" : "хост офлайн"}</span>` : "";
      const players = r.players.map((p) =>
        `<span class="p ${p.ready ? "ready" : ""} ${p.online ? "" : "offline"}"><span class="d"></span>${esc(p.name)}${p.host ? " ★" : ""}${p.online && p.ping != null ? ` <span class="muted">${p.ping} мс</span>` : ""}</span>`).join("");
      return `<div class="room ${open.has(r.code) ? "open" : ""}" data-code="${r.code}">
        <div class="head">
          <div class="code">${r.code}</div>
          <div class="meta">
            <div class="host">Хост: <b>${r.host ? esc(r.host.name) : "—"}</b></div>
            <div>${hostSt}${cd}<span class="muted">создана ${ago(data.now - r.createdAt)} назад · активность ${ago(data.now - r.touched)} назад</span></div>
          </div>
          <div class="nums"><b>${r.total}</b> <span class="muted">чел.</span> · <span style="color:var(--ok)">${r.ready}</span> <span class="muted">готовы</span> · ${r.online} <span class="muted">онлайн</span></div>
        </div>
        <div class="body">
          <div class="players">${players}</div>
          <div class="muted" style="margin-bottom:10px">Отсчёт: ${r.seconds} с · Забанено: ${r.banned}</div>
          <button data-close="${r.code}">Закрыть комнату</button>
        </div>
      </div>`;
    }).join("");
  }

  $("list").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-close]");
    if (btn) {
      const code = btn.dataset.close;
      if (!confirm(`Закрыть комнату ${code} для всех участников?`)) return;
      await fetch(`/admin/api/close?code=${encodeURIComponent(code)}`, { method: "POST" });
      return load();
    }
    const head = e.target.closest(".head");
    if (!head) return;
    const code = head.parentElement.dataset.code;
    open.has(code) ? open.delete(code) : open.add(code);
    head.parentElement.classList.toggle("open");
  });
  $("filter").addEventListener("input", render);

  async function load() {
    try {
      const r = await fetch("/admin/api/rooms", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      data = await r.json();
      $("updated").textContent = "обновлено " + new Date().toLocaleTimeString("ru-RU");
      $("updated").className = "muted";
      render();
    } catch (err) {
      $("updated").textContent = "нет связи с сервером";
      $("updated").className = "err";
    }
  }
  load();
  setInterval(load, 3000);
})();
</script>
</body>
</html>
